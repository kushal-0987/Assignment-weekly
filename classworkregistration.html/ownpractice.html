<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration Form</title>
  <form>
    <h2 style="text-align:center;">Registration Form</h2>
    <table border="5px" align="center">
      <tr>
        <td>First Name:</td>
        <td><input type="text" name="firstName" placeholder="Enter your first name" required></td>
      </tr>
      <tr>
        <td>Last Name:</td>
        <td><input type="text" name="lastName" placeholder="Enter your last name" required></td>
      </tr>
      <tr>
        <td>Password:</td>
        <td><input type="password" name="password" placeholder="Enter your password" required></td>
      </tr>
      <tr>
        <td>Re-enter Password:</td>
        <td><input type="password" name="confirmPassword" placeholder="Re-enter your password" required></td>
      </tr>
      <tr>
        <td>Email:</td>
        <td><input type="email" name="email" placeholder="Enter your email" required></td>
      </tr>
      <tr>
        <td>Phone No.:</td>
        <td><input type="tel" name="phone" placeholder="Enter your phone number" required></td>
      </tr>
      <tr>
        <td>Address:</td>
        <td><textarea name="address" rows="6" placeholder="Enter your address" required></textarea></td>
      </tr>
      <tr>
        <td>Gender:</td>
        <td>
          <label><input type="radio" name="gender" value="Male" required> Male</label>
          <label><input type="radio" name="gender" value="Female"> Female</label>
          <label><input type="radio" name="gender" value="Other"> Other</label>
        </td>
      </tr>
      <tr>
        
    <tr>
      <td>Hobbies:</td>
      <td>
        <label><input type="checkbox"> Reading</label>
        <label><input type="checkbox"> Traveling</label>
        <label><input type="checkbox"> Music</label>
        <label><input type="checkbox"> Sports</label>
      </td>
    </tr>

    <tr>
      <td>Date of Birth:</td>
      <td><input type="date" required></td>
    </tr>
    <tr>
      <td>Country:</td>
      <td>
        <select required>
          <option value="">Select Country</option>
          <option>India</option>
          <option>USA</option>
          <option>UK</option>
          <option>Australia</option>
        </select>
      </td>
    </tr>
     <tr>
      <td>Upload Your Picture:</td>
      <td><input type="file" accept="image/*" required></td>
    </tr>

    <tr>
      <td colspan="2" class="buttons" align="center">
        <input type="submit" class="save" align="center" value="Save My Data">
        <input type="reset" class="reset" align="center" value="Reset Data">
      </td>
    </tr>

  </table>

</body>
</html>
